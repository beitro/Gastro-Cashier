name: Neon PostgreSQL migration safety

on:
  pull_request:
    paths:
      - 'schema.sql'
      - 'scripts/db-*.mjs'
      - 'server/**'
      - 'package.json'
      - '.github/workflows/neon-db-safety.yml'
  push:
    branches:
      - feat/neon-postgres-safe-foundation
  workflow_dispatch:

jobs:
  neon-readonly-inspection:
    if: ${{ vars.ENABLE_NEON_READONLY_CHECK == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Inspect configured Neon database (read-only)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run db:check

  migration-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gastro_empty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gastro_empty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Inspect empty test database (read-only)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gastro_empty_test
        run: npm run db:check
      - name: Apply schema only after explicit empty-database confirmation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gastro_empty_test
          CONFIRM_EMPTY_DATABASE_MIGRATION: YES
        run: npm run db:migrate
      - name: Verify migrated schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gastro_empty_test
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const result = await client.query("SELECT to_regclass('public.tenants') AS tenants, to_regclass('public.v_table_board') AS board");
          if (!result.rows[0].tenants || !result.rows[0].board) throw new Error('Required schema objects are missing');
          await client.end();
          NODE

  neon-apply-baseline:
    # One-shot opt-in: this job runs only for the specifically marked push.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-neon-schema]') && vars.ENABLE_NEON_READONLY_CHECK == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Inspect Neon immediately before migration
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run db:check
      - name: Apply baseline only if public schema is still empty
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CONFIRM_EMPTY_DATABASE_MIGRATION: YES
        run: npm run db:migrate
      - name: Verify key schema objects in Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const result = await client.query(`
            SELECT
              to_regclass('public.tenants') AS tenants,
              to_regclass('public.outlets') AS outlets,
              to_regclass('public.dining_sessions') AS dining_sessions,
              to_regclass('public.menu_items') AS menu_items,
              to_regclass('public.v_table_board') AS table_board,
              (SELECT count(*)::int FROM pg_tables WHERE schemaname = 'public') AS table_count,
              (SELECT count(*)::int FROM pg_policies WHERE schemaname = 'public') AS policy_count
          `);
          const row = result.rows[0];
          if (!row.tenants || !row.outlets || !row.dining_sessions || !row.menu_items || !row.table_board) {
            throw new Error('Post-migration verification failed: required objects are missing');
          }
          console.log(JSON.stringify({
            verification: 'success',
            database: (await client.query('SELECT current_database() AS name')).rows[0].name,
            tableCount: row.table_count,
            policyCount: row.policy_count,
            requiredObjects: ['tenants', 'outlets', 'dining_sessions', 'menu_items', 'v_table_board']
          }, null, 2));
          await client.end();
          NODE
